name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager=$SDKMANAGER"
          echo "y" | $SDKMANAGER --licenses
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
            echo "storeFile=../release.jks" >> key.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # 注意：自 V2.0.0 起闭源发布，Release 安装包改为手动上传，CI 不再自动上传 APK。
      # 公开仓库里的代码是 V1.x（1.0.0），CI 打出来的 app-release.apk 是旧版，
      # 自动上传会污染 V2 的 Release，故去掉上传步骤，只保留编译验证。
