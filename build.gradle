// 顶层构建文件：仅保留强开 DeX 所需的插件
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.refine) apply false
    alias(libs.plugins.kotlin.android) apply false
}

// 开源发布不靠 lint 卡构建：关闭所有 Android 模块的 release fatal lint 检查
subprojects {
    afterEvaluate { p ->
        def isAndroid = p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library')
        if (isAndroid) {
            p.android.lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
        }
    }
}
