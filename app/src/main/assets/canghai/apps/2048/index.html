<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<style>
:root{--ink:#ffe3ef;--muted:#d9a8cc;--pink:#ff5f9a;--rose:#ff6f9e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 44%,rgba(255,92,142,.22) 0%,transparent 55%),radial-gradient(ellipse at 50% 40%,#5b2a72 0%,#3a1650 48%,#1d0930 100%);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco i{position:absolute;display:block}
.bub{border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(255,255,255,.06) 55%);box-shadow:0 0 12px rgba(255,255,255,.18)}
.spk{color:#ffd9a0;font-style:normal;text-shadow:0 0 10px rgba(255,200,120,.9),0 0 4px #fff}
.spk.pink{color:#ff9ec6;text-shadow:0 0 10px rgba(255,120,170,.9),0 0 4px #fff}
.gum{width:44px;height:44px;border-radius:15px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),transparent 42%),var(--c);box-shadow:inset -5px -7px 10px rgba(0,0,0,.18),0 0 20px rgba(255,255,255,.15)}
.bok{border-radius:50%;background:radial-gradient(circle,rgba(255,120,170,.20),rgba(255,120,170,0) 70%)}
.bok.violet{background:radial-gradient(circle,rgba(168,85,247,.22),rgba(168,85,247,0) 70%)}
/* background life (user-approved exception to the no-infinite-animation rule:
   transform/opacity only, very slow, pauses when the page is hidden) */
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx,10px),var(--dy,-12px))}}
@keyframes bob{from{transform:rotate(var(--rot,0deg)) translateY(-5px)}to{transform:rotate(var(--rot,0deg)) translateY(5px)}}
@keyframes twinkle{from{opacity:.5;transform:scale(.85) rotate(0deg)}to{opacity:1;transform:scale(1.08) rotate(12deg)}}
@keyframes breathe{from{opacity:.65;transform:translate(0,0) scale(1)}to{opacity:1;transform:translate(var(--dx,12px),var(--dy,8px)) scale(1.06)}}
#deco .bub{animation:drift var(--dur,14s) ease-in-out var(--del,0s) infinite alternate}
#deco .spk{animation:twinkle var(--dur,4s) ease-in-out var(--del,0s) infinite alternate}
#deco .gum{animation:bob var(--dur,12s) ease-in-out var(--del,0s) infinite alternate}
#deco .bok{animation:breathe var(--dur,24s) ease-in-out var(--del,0s) infinite alternate}
#deco.paused *{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){#deco *{animation:none}}
header,#stage{position:relative;z-index:1}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:18px 18px 2px;max-width:620px;width:100%;margin:0 auto}
h1{margin:0;font-size:clamp(27px,7.2vw,38px);line-height:1.1;font-weight:800;letter-spacing:2px;white-space:nowrap;filter:drop-shadow(0 2px 0 #e85a8a) drop-shadow(0 5px 0 #a81e55) drop-shadow(0 8px 12px rgba(0,0,0,.45))}
h1 .berry{font-size:.85em;margin-right:2px}
h1 .grad{background:linear-gradient(180deg,#ffffff 5%,#ffe9f2 38%,#ff9ebb 78%,#ff7ba8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.scores{display:flex;gap:8px}
.sc{position:relative;overflow:hidden;background:rgba(43,18,66,.72);border:1.5px solid rgba(255,255,255,.28);border-radius:18px;padding:5px 14px;text-align:center;min-width:70px;box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.15)}
.sc::before{content:'';position:absolute;top:5px;left:9px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 6px #fff}
.sc small{display:block;font-size:13px;color:var(--muted);letter-spacing:1px}
.sc span{font-size:21px;font-weight:800;display:inline-block;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.sc span.bump{animation:bump .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;white-space:nowrap;color:#fff;text-shadow:0 2px 3px rgba(150,10,60,.4);background:linear-gradient(#ff9ab8,#ff5c8e);box-shadow:0 5px 18px rgba(255,92,142,.5),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(180,20,80,.35);cursor:pointer;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
button:active{transform:translateY(2px) scale(1.05,.92)}
button:focus-visible{outline:3px solid #ffd94d;outline-offset:2px}
.btnRow{display:flex;gap:8px}
.btnRow button{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
#snd{padding:10px 14px;background:rgba(43,18,66,.72);color:#fff;text-shadow:none;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.15)}
#stage{flex:1;min-height:0;touch-action:none}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(255,217,77,.22),rgba(255,217,77,0) 62%);opacity:0;z-index:2}
#stage.pulse::after{animation:stagePulse .9s ease-out forwards}
@keyframes stagePulse{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(26,10,46,.82);text-align:center}
#ov.on{display:flex;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
#ov .card{background:rgba(58,22,80,.94);border:1.5px solid rgba(255,255,255,.22);border-radius:28px;padding:30px 38px 26px;box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:12px}
#ov h2{margin:0;font-size:30px;font-weight:800;background:linear-gradient(180deg,#ffffff,#ff8fb3);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #a81e55) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#ov p{margin:0;color:var(--ink)}
#ov.win .card{border-color:rgba(255,217,77,.7);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 34px rgba(255,217,77,.28),inset 0 2px 0 rgba(255,255,255,.12)}
#ov.win .card h2{background-image:linear-gradient(180deg,#fff,#ffd94d 55%,#ff9a3d);filter:drop-shadow(0 2px 0 #8a6d1a) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;display:none}
#ov.win .confetti{display:block}
.confetti i{position:absolute;left:50%;top:46%;font-style:normal;color:#ffd94d;text-shadow:0 0 10px rgba(255,217,77,.9);opacity:0;animation:celebrate 1.9s cubic-bezier(.15,.7,.3,1) forwards;animation-delay:var(--del,0s)}
@keyframes celebrate{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(0deg)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot))}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.mfx{position:absolute;z-index:3;pointer-events:none}
.mfx .num{position:absolute;left:0;top:0;font-size:44px;font-weight:800;white-space:nowrap;background:linear-gradient(180deg,#fff,#ffd94d 55%,#ff9a3d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #a81e55) drop-shadow(0 6px 12px rgba(0,0,0,.45));animation:mfxPop 1.4s cubic-bezier(.3,1.6,.5,1) forwards}
.mfx.big .num{font-size:58px}
.mfx .praise{position:absolute;left:0;top:36px;font-size:15px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55);white-space:nowrap;animation:mfxPop 1.4s cubic-bezier(.3,1.6,.5,1) forwards}
.mfx.big .praise{top:46px}
.mfx i{position:absolute;left:0;top:0;font-style:normal;color:#ffd94d;text-shadow:0 0 8px rgba(255,217,77,.9);animation:burst .9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes mfxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
@keyframes burst{from{opacity:1;transform:translate(-50%,-50%) scale(.6) rotate(0deg)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot))}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:50;display:flex;align-items:center;gap:10px;background:rgba(43,18,66,.94);border:1.5px solid rgba(255,217,77,.65);border-radius:999px;padding:10px 18px;box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 18px rgba(255,217,77,.25);transition:transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none;max-width:92vw}
#toast.on{transform:translate(-50%,0)}
#toast .ti{font-size:22px;flex-shrink:0}
#toast b{color:#ffd94d;font-size:15px;white-space:nowrap}
#toast span{color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on .ti{animation:toastPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes toastPop{0%{transform:scale(.4) rotate(-18deg)}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
#noruntime{display:none;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px;text-align:center;padding:20px}
</style>

<div id="deco"></div>
<header>
  <div><h1><span class="grad">2048</span></h1></div>

[[2,16,'#7be382',-16],[92,9,'#ff8fb3',18],[93,80,'#5ec8f2',-14],[3,88,'#ffd94d',12],[90,52,'#c99df2',-8]].forEach((g,i)=>{h+=`<i class="gum" style="left:${g[0]}%;top:${g[1]}%;--c:${g[2]};--rot:${g[3]}deg;--dur:${10+rn(i+90)*4}s;--del:${-rn(i+91)*10}s"></i>`});

const shC=document.createElement('canvas');shC.width=shC.height=128;const shX=shC.getContext('2d');
const shG=shX.createRadialGradient(64,64,10,64,64,64);shG.addColorStop(0,'rgba(255,92,142,.28)');shG.addColorStop(.55,'rgba(255,92,142,.12)');shG.addColorStop(1,'rgba(255,92,142,0)');

{const p=labG.attributes.position;for(let i=0;i<p.count;i++){const a=Math.pow(p.getX(i)/.42,2),b=Math.pow(p.getZ(i)/.42,2);p.setY(i,.44*Math.pow(Math.max(0,1-a*a-b*b),.35)+.006)}}

function loop(now){
if(!rendering)return;
const dt=Math.min((now-last)/1000,1/30);last=now;
const all=tiles.concat(dying);
for(let i=0;i<2;i++){const h=dt/2;
for(const t of all){
t.vx+=(260*(t.tx-t.x)-26*t.vx)*h;t.vz+=(260*(t.tz-t.z)-26*t.vz)*h;
t.x+=t.vx*h;t.z+=t.vz*h;
t.pv+=(320*(0-t.p)-26*t.pv)*h;t.p+=t.pv*h}}
for(const t of all)if(t.sp<1)t.sp=Math.min(1,t.sp+dt/.28);
const done=settled();
if(done)snapAll();
applyTransforms();
renderer.render(scene,cam);
if(done){rendering=false;rafId=0;return}
rafId=requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{
if(document.hidden){rendering=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;dc.classList.add('paused')}
else{dc.classList.remove('paused');kick()}});

// Governor quality hint (perf spec section 7): {canghai:'quality', tier, fps, dpr}
addEventListener('message',e=>{
const d=e.data;
if(!d||d.canghai!=='quality'||!d.tier||!QDPR[d.tier])return;
dprCap=(typeof d.dpr==='number'&&d.dpr>0)?Math.min(d.dpr,QDPR[d.tier]):QDPR[d.tier];
renderer.setPixelRatio(Math.min(devicePixelRatio||1,dprCap));
resize();kick()});

addEventListener('pagehide',()=>{rendering=false;if(rafId)cancelAnimationFrame(rafId);try{renderer.dispose()}catch(e){}});

resize();reset();
})();
</script>
</body>
</html>
