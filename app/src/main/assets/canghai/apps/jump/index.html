<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沧海系统 · 跳一跳</title>
<style>
:root{--bg1:#dff1fb;--bg2:#f6efe0;--tx:#1d3b53;--card:rgba(255,255,255,.75);--ac:#d62b2b;--m:#5d7189;--gold:#b18e46;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m:#8fa4c0;--gold:#ecd28f;--bg1:#16283a;--bg2:#2b2433;--tx:#e8f1f8;--card:rgba(20,30,44,.75);color-scheme:dark}}
:root[data-theme="dark"]{--m:#8fa4c0;--gold:#ecd28f;--bg1:#16283a;--bg2:#2b2433;--tx:#e8f1f8;--card:rgba(20,30,44,.75);color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
html{background:linear-gradient(180deg,var(--bg1),var(--bg2))}#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}canvas{position:fixed;z-index:0;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:10;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(var(--ch-safe-top, env(safe-area-inset-top, 0px)) + 14px) 16px 0;pointer-events:none}
#score{font-family:'STKaiti','KaiTi','Kaiti SC','Songti SC',serif;font-size:50px;font-weight:900;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.15)}#score::after{content:'分';font-size:16px;color:var(--gold);margin-left:4px;letter-spacing:.1em}
#best{font-family:'STKaiti','KaiTi','Kaiti SC','Songti SC',serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.1em;margin-top:6px}
.btn{pointer-events:auto;background:#262548;color:#f3e3b8;border:1px solid #ecd28f;border-radius:4px;padding:8px 16px;font-size:15px;font-family:'STKaiti','KaiTi','Kaiti SC','Songti SC',serif;font-weight:700;letter-spacing:.15em;cursor:pointer;box-shadow:inset 0 0 0 2px #262548,inset 0 0 0 3px rgba(236,210,143,.5)}.btn:active{background:#34326a}
#bar{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(var(--ch-safe-bottom, env(safe-area-inset-bottom, 0px)) + 56px);width:min(60vw,260px);height:8px;border-radius:4px;background:var(--card);overflow:hidden;opacity:0;transition:opacity .15s}
#bar i{display:block;height:100%;width:0;background:var(--ac)}
#toast{position:fixed;z-index:10;left:50%;top:30%;transform:translateX(-50%);font-size:28px;font-weight:800;color:var(--ac);opacity:0;pointer-events:none;transition:opacity .3s}
#over{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.5)}
#over div{background:linear-gradient(180deg,#2d2b58,#1e1d3c);border:2px solid #ecd28f;border-radius:6px;padding:30px 46px 28px;text-align:center;color:#f3e3b8;font-family:'STKaiti','KaiTi','Kaiti SC','Songti SC',serif;box-shadow:inset 0 0 0 5px #262548,inset 0 0 0 6px rgba(236,210,143,.6),0 14px 40px rgba(0,0,0,.45)}
#over h2{margin:0 0 10px;font-size:32px;color:#ecd28f;letter-spacing:.2em}#over p{margin:0 0 20px;font-size:18px;letter-spacing:.1em}#over b{font-size:34px;color:#ecd28f}
#over .btn{font-size:17px;padding:10px 30px}
#gear{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid rgba(236,210,143,.6);color:var(--tx);font-size:19px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#setBack{position:fixed;z-index:30;inset:0;display:none;background:rgba(10,12,30,.35)}
#panel{position:fixed;z-index:31;top:calc(var(--ch-safe-top, env(safe-area-inset-top, 0px)) + 64px);right:16px;width:min(280px,calc(100vw - 32px));display:none;background:linear-gradient(180deg,#2d2b58,#1e1d3c);border:1px solid #ecd28f;border-radius:8px;padding:18px 20px 20px;color:#f3e3b8;font-family:'STKaiti','KaiTi','Kaiti SC','Songti SC',serif;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#panel h3{margin:0 0 14px;font-size:18px;color:#ecd28f;letter-spacing:.2em;display:flex;justify-content:space-between;align-items:center}
#panel h3 button{background:none;border:0;color:#f3e3b8;font-size:18px;cursor:pointer;padding:0 2px}
#panel .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(236,210,143,.25);font-size:15px;letter-spacing:.08em}
#panel .row:first-of-type{border-top:0}
#panel .row .btn{font-size:14px;padding:6px 14px}
#panel .sw{position:relative;width:44px;height:24px;flex:none;cursor:pointer}
#panel .sw input{opacity:0;width:0;height:0;position:absolute}
#panel .sw i{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.25);transition:.2s}
#panel .sw i::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#f3e3b8;transition:.2s}
#panel .sw input:checked + i{background:#ecd28f}
#panel .sw input:checked + i::after{left:23px;background:#262548}
#panel .full{width:100%;margin-top:14px;text-align:center}

.btn:focus-visible,#gear:focus-visible,#panel h3 button:focus-visible{outline:2px solid #c9a85c;outline-offset:2px}
::selection{background:rgba(201,168,92,.35)}
</style>
</head>
<body>
<svg id='bg' viewBox='0 0 1000 600' preserveAspectRatio='xMidYMax slice' aria-hidden='true'>
<defs><linearGradient id='mf' x1='0' y1='0' x2='0' y2='1'><stop offset='0' style='stop-color:var(--bg2);stop-opacity:0'/><stop offset='1' style='stop-color:var(--bg2);stop-opacity:.9'/></linearGradient></defs>
<g class='drift' fill='#fff' opacity='.45'><ellipse cx='200' cy='120' rx='110' ry='14'/><ellipse cx='260' cy='108' rx='70' ry='12'/><ellipse cx='760' cy='90' rx='120' ry='13'/></g>
<path d='M0 600V400Q200 330 400 390T800 380T1000 400V600Z' fill='var(--m)' opacity='.14'/>

<path d='M0 600V470Q250 420 500 470T1000 450V600Z' fill='var(--m)' opacity='.18'/>


<rect y='380' width='1000' height='220' fill='url(#mf)'/>
</svg>
<div class="ui">
  <div><div id="score">0</div><div id="best">最高 0</div></div>
  <button id="gear" aria-label="设置">⚙</button>
</div>
<div id="bar"><i></i></div>
<div id="setBack"></div>
<div id="panel" role="dialog" aria-label="设置">
  <h3>设置<button id="closePanel" aria-label="关闭">✕</button></h3>
  <div class="row"><span>自定义旗面</span><label class="btn">上传图片<input id="file" type="file" accept="image/*" hidden></label></div>
  <div class="row"><span>深色模式</span><label class="sw"><input id="darkMode" type="checkbox"><i></i></label></div>
  <div class="row"><span>音效</span><label class="sw"><input id="soundToggle" type="checkbox" checked><i></i></label></div>
  <div class="row"><span>画质</span><button id="qualityBtn" class="btn">中</button></div>
  <div class="row"><span>重开一局</span><button id="restart" class="btn">重开</button></div>
</div>
<div id="toast">中心 +2</div>
<div id="over"><div><h2>坠入沧海</h2><p>得分 <b id="fs">0</b></p><button id="again" class="btn">再来一局</button></div></div>
<script src="../../shared/three_runtime.js"></script>
<script src="../../shared/achievements.js"></script>
<script>var THREE = window.CH_MODULES["three"];</script>
<script>
const $=id=>document.getElementById(id);
// 合成音效 (WebAudio, 无音频文件)
let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,dur,type,vol,delay){
if(!soundOn)return;const c=ac();if(!c)return;
const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
o.type=type||'sine';o.frequency.setValueAtTime(Math.max(30,f0),t);
if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);
g.gain.exponentialRampToValueAtTime(.0001,t+dur);
o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05)}
let chargeOsc=null,chargeGain=null;
function sfxChargeStart(){
if(!soundOn)return;const c=ac();if(!c)return;
sfxChargeStop();
const o=c.createOscillator(),g=c.createGain();
o.type='sine';o.frequency.setValueAtTime(180,c.currentTime);
o.frequency.linearRampToValueAtTime(520,c.currentTime+1.8);
g.gain.setValueAtTime(.0001,c.currentTime);
g.gain.exponentialRampToValueAtTime(.07,c.currentTime+.05);
o.connect(g);g.connect(c.destination);o.start();
chargeOsc=o;chargeGain=g}
function sfxChargeStop(){
if(!chargeOsc)return;
try{const t=chargeOsc.context.currentTime;chargeGain.gain.cancelScheduledValues(t);chargeGain.gain.setTargetAtTime(.0001,t,.02);chargeOsc.stop(t+.08)}catch(e){}
chargeOsc=null;chargeGain=null}
function sfxJump(d){tone(280+d*30,520+d*30,.16,'sine',.14)}
function sfxLand(){tone(440,540,.09,'sine',.13)}
function sfxPerfect(){tone(880,880,.12,'triangle',.13);tone(1320,1320,.16,'triangle',.11,.08)}
function sfxTap(){tone(160,120,.07,'sine',.07)}
function sfxFall(){tone(500,140,.5,'sine',.12)}
function sfxOver(){tone(300,300,.18,'triangle',.12);tone(200,200,.3,'triangle',.11,.16)}
function sfxClick(){tone(600,500,.06,'sine',.08)}

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;if('outputColorSpace' in renderer)renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
const camOff=new THREE.Vector3(10,11,10), tgt=new THREE.Vector3();
let dprCap=2,resizeQueued=false,lastW=0,lastH=0,lastPR=0;
function resize(){
  if(resizeQueued)return;resizeQueued=true;
  requestAnimationFrame(()=>{resizeQueued=false;
    const pr=Math.min(devicePixelRatio,dprCap),w=innerWidth,h=innerHeight;
    if(w===lastW&&h===lastH&&pr===lastPR)return;
    lastW=w;lastH=h;lastPR=pr;
    renderer.setPixelRatio(pr);renderer.setSize(w,h);
    const a=w/h;let hh=7,hw=hh*a;if(hw<5.5){hw=5.5;hh=hw/a}
    cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix();
  });
}
addEventListener('resize',resize);resize();
// 窗口模式下 iframe 尺寸变化不一定触发 window resize：用 ResizeObserver 直接监听视口尺寸，
// 画布 buffer 一变就重设，保证 canvas.width/height 始终 ≈ 显示尺寸 × pixelRatio，不被拉伸变虚。
if('ResizeObserver' in window){const ro=new ResizeObserver(()=>resize());ro.observe(document.documentElement);}
scene.add(new THREE.AmbientLight(0xffffff,.65));
const sun=new THREE.DirectionalLight(0xffffff,.8);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40});
scene.add(sun,sun.target);

// ---------- 画质档（性能规范 §2/§7，默认中档） ----------
const QUALITY={high:{shadow:true,size:1024},medium:{shadow:true,size:512},low:{shadow:false,size:256}};
let qualityTier='medium';
function applyQuality(tier){
  const q=QUALITY[tier];if(!q)return;qualityTier=tier;
  const sizeChanged=sun.shadow.mapSize.x!==q.size;
  sun.castShadow=q.shadow;sun.shadow.mapSize.set(q.size,q.size);
  if(sizeChanged&&sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
  if(renderer.shadowMap.enabled!==q.shadow){
    renderer.shadowMap.enabled=q.shadow;
    scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
  }
  const qb=$('qualityBtn');if(qb)qb.textContent={high:'高',medium:'中',low:'低'}[tier];
}
applyQuality('medium');
addEventListener('message',e=>{
  const d=e&&e.data;if(!d||d.canghai!=='quality')return;
  if(d.tier)applyQuality(d.tier);
  if(typeof d.dpr==='number'&&d.dpr>0){dprCap=d.dpr;lastW=0;resize();}
});

// ---------- 主角：沙盘旗子 ----------
const FW=1.3,FH=.87;
const player=new THREE.Group(),body=new THREE.Group();
player.add(body);body.rotation.y=Math.PI/4;
const mk=(g,c,y)=>{const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));m.position.y=y;m.castShadow=true;body.add(m);return m};
mk(new THREE.CylinderGeometry(.42,.5,.14,28),0x8a6a3c,.07);
mk(new THREE.CylinderGeometry(.3,.45,.22,24),0xe2c88f,.25);
const pole=mk(new THREE.CylinderGeometry(.035,.035,1,10),0xf0c040,1.1);
const mk2=(g,c,x,y,z)=>{const m=mk(g,c,y);m.position.x=x;m.position.z=z;return m};
const crown=mk(new THREE.CylinderGeometry(.09,.12,.1,10),0xe0b040,1.9);
const ball=mk(new THREE.SphereGeometry(.05,12,12),0xffd84a,1.99);
const pin=mk(new THREE.CylinderGeometry(.014,.014,.62,8),0xf0c040,1.93);pin.rotation.z=Math.PI/2;
mk(new THREE.CylinderGeometry(.05,.05,.04,10),0xf0c040,.5);
const band2=mk(new THREE.CylinderGeometry(.05,.05,.04,10),0xf0c040,1.4);
mk(new THREE.CylinderGeometry(.04,.04,.12,10),0xb5532a,.5);
mk2(new THREE.TorusGeometry(.07,.022,8,16),0x9fd3c0,0,.88,.06);
mk2(new THREE.ConeGeometry(.045,.2,10),0xb5532a,0,.66,.06).rotation.x=Math.PI;
mk(new THREE.TorusGeometry(.46,.025,8,28),0xf0c040,.14).rotation.x=Math.PI/2;
function srgbTex(t){if(THREE.SRGBColorSpace!==undefined&&'colorSpace' in t)t.colorSpace=THREE.SRGBColorSpace;else t.encoding=THREE.sRGBEncoding;return t}
function drawGold(g,w,h){g.strokeStyle='rgba(224,178,90,.55)';g.lineWidth=2;for(let k=0;k<7;k++){const x=(k*97)%w,y=(k*61)%h;for(let r=4;r<22;r+=6){g.beginPath();g.arc(x,y,r,Math.PI*.9,Math.PI*2.1);g.stroke()}g.beginPath();g.arc(x+26,y+6,10,Math.PI,Math.PI*2);g.stroke()}}
function defTex(){
  const c=document.createElement('canvas');c.width=320;c.height=213;const g=c.getContext('2d');
  g.fillStyle='#262548';g.fillRect(0,0,320,213);drawGold(g,320,213);g.strokeStyle='#e0b25a';g.lineWidth=8;g.strokeRect(6,6,308,201);
  g.fillStyle='#ffd84a';g.beginPath();
  
  g.fill();g.font='bold 78px STKaiti,KaiTi,serif';g.textAlign='center';g.fillStyle='#e8c26a';g.fillText('沧海',160,125);
  const t=new THREE.CanvasTexture(c);srgbTex(t);return t;
}
const flagGeo=new THREE.PlaneGeometry(FW,FH,24,14);flagGeo.translate(FW/2,0,0);
const orig=flagGeo.attributes.position.array.slice();
const flagMat=new THREE.MeshLambertMaterial({map:defTex(),side:THREE.DoubleSide});
const flag=new THREE.Mesh(flagGeo,flagMat);flag.castShadow=true;body.add(flag);
function placeFlag(){
  const fh=FH*flag.scale.y,top=Math.max(1.82,.9+fh);
  flag.position.set(.04,top-fh/2,0);
  pole.scale.y=top-.36;pole.position.y=.36+(top-.36)/2;
  crown.position.y=top+.08;ball.position.y=top+.17;pin.position.y=top+.11;band2.position.y=top-.42;
}
flag.scale.y=1;placeFlag();
function waveFlag(t,amp){
  const p=flagGeo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){
    const k=orig[i]/FW;
    p[i+2]=Math.sin(k*6-t*8+orig[i+1]*2)*.13*amp*k;
    p[i+1]=orig[i+1]-k*k*.05*amp;
  }
  flagGeo.attributes.position.needsUpdate=true;flagGeo.computeVertexNormals();
}
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const t=new THREE.Texture(img);srgbTex(t);t.needsUpdate=true;
    if(flagMat.map)flagMat.map.dispose();
    flagMat.map=t;flagMat.needsUpdate=true;
    flag.scale.y=Math.min(2,Math.max(.5,(img.height/img.width)/(FH/FW)));placeFlag();
  };img.src=r.result};
  r.readAsDataURL(f);e.target.value='';
});
player.scale.setScalar(1.3);scene.add(player);

// ---------- 方块 ----------
const PAL=[0x2b2a4c,0x8c2f2b,0x3f6f68,0x6b4a33,0x4a3d66];
const goldM=new THREE.MeshLambertMaterial({color:0xe0b040});
const topTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');drawGold(g,128,128);g.strokeStyle='rgba(224,178,90,.9)';g.lineWidth=5;g.strokeRect(4,4,120,120);const t=new THREE.CanvasTexture(c);srgbTex(t);return t})();
const topM=new THREE.MeshLambertMaterial({map:topTex,transparent:true});
function trim(m,s,round){
  const rim=new THREE.Mesh(round?new THREE.CylinderGeometry(s/2+.07,s/2+.07,.1,32):new THREE.BoxGeometry(s+.14,.1,s+.14),goldM);rim.position.y=1.9;
  const top=new THREE.Mesh(round?new THREE.CircleGeometry(s/2,32):new THREE.PlaneGeometry(s,s),topM);top.rotation.x=-Math.PI/2;top.position.y=2.006;top.receiveShadow=true;
  m.add(rim,top);
}
function disposeBlock(m){
  m.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material&&o.material!==goldM&&o.material!==topM)o.material.dispose();
  });
}
let blocks=[],dir=new THREE.Vector3(1,0,0),cur,next;
function addBlock(){
  const last=blocks[blocks.length-1];
  dir=Math.random()<.5?new THREE.Vector3(1,0,0):new THREE.Vector3(0,0,-1);
  const s=1.5+Math.random()*1.4,round=Math.random()<.4;
  const d=last.s/2+1.2+Math.random()*2.2+s/2;
  const col=new THREE.Color(PAL[Math.random()*PAL.length|0]);
  const geo=round?new THREE.CylinderGeometry(s/2,s/2,4,32):new THREE.BoxGeometry(s,4,s);
  const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col}));
  m.receiveShadow=true;m.castShadow=true;trim(m,s,round);
  const b={m,s,round,x:last.x+dir.x*d,z:last.z+dir.z*d,off:8};
  m.position.set(b.x,-2+b.off,b.z);scene.add(m);blocks.push(b);
  if(blocks.length>4){const o=blocks.shift();scene.remove(o.m);disposeBlock(o.m)}
  return b;
}
const inside=(b,x,z)=>b.round?Math.hypot(x-b.x,z-b.z)<=b.s/2:Math.abs(x-b.x)<=b.s/2&&Math.abs(z-b.z)<=b.s/2;

// ---------- 游戏状态 ----------
let st='idle',chargeT=0,jump=null,fall=null,score=0,best=0;
try{best=+localStorage.getItem('flagjump_best')||0}catch(e){}
$('best').textContent='最高 '+best;
function reset(){
  sfxChargeStop();
  blocks.forEach(b=>{scene.remove(b.m);disposeBlock(b.m)});blocks=[];
  const f={m:null,s:2.4,round:false,x:0,z:0,off:0};
  f.m=new THREE.Mesh(new THREE.BoxGeometry(2.4,4,2.4),new THREE.MeshLambertMaterial({color:0x2b2a4c}));
  f.m.position.set(0,-2,0);f.m.receiveShadow=true;trim(f.m,2.4,false);scene.add(f.m);blocks.push(f);
  cur=f;next=addBlock();
  player.position.set(0,0,0);player.rotation.set(0,0,0);body.scale.set(1,1,1);body.rotation.y=Math.PI/4;
  score=0;$('score').textContent=0;st='idle';$('over').style.display='none';
  tgt.set(next.x/2,0,next.z/2);
}
reset();
if(window.CHAch)CHAch.markDay('jump');
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,700)}
let panelOpen=false;
function down(){if(panelOpen)return;if(st==='idle'){st='charge';chargeT=0;barEl.style.opacity=1;sfxChargeStart()}}
function up(){
  if(st!=='charge')return;
  const dist=.4+Math.min(chargeT,1.8)*4.4;
  jump={sx:player.position.x,sz:player.position.z,dist,t:0,dur:.3+dist*.05,d:dir.clone()};
  st='jump';body.scale.set(1,1,1);barEl.style.opacity=0;sfxChargeStop();sfxJump(dist);
}
const cv=renderer.domElement,barEl=$('bar'),barFill=barEl.firstElementChild;
cv.addEventListener('pointerdown',e=>{e.preventDefault();down()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat)down()});
addEventListener('keyup',e=>{if(e.code==='Space')up()});
$('again').onclick=reset;

// ---------- 设置面板 ----------
const panel=$('panel'),setBack=$('setBack');
function openPanel(){panelOpen=true;panel.style.display='block';setBack.style.display='block'}
function closePanel(){panelOpen=false;panel.style.display='none';setBack.style.display='none'}
$('gear').onclick=openPanel;$('closePanel').onclick=closePanel;setBack.onclick=closePanel;
$('restart').onclick=()=>{closePanel();reset()};
const dm=$('darkMode');
try{const t=localStorage.getItem('flagjump_theme');if(t){document.documentElement.dataset.theme=t;dm.checked=(t==='dark')}else{dm.checked=matchMedia('(prefers-color-scheme: dark)').matches}}catch(e){}
dm.onchange=()=>{const t=dm.checked?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('flagjump_theme',t)}catch(e){}};
const sndT=$('soundToggle');
sndT.onchange=()=>{soundOn=sndT.checked;if(!soundOn)sfxChargeStop();else sfxClick()};
$('qualityBtn').onclick=()=>{const order=['high','medium','low'];applyQuality(order[(order.indexOf(qualityTier)+1)%3])};

function land(){
  const x=player.position.x,z=player.position.z;
  player.position.y=0;body.rotation.y=Math.PI/4;
  if(inside(next,x,z)){
    const c=Math.hypot(x-next.x,z-next.z)<.35;
    cur=next;score+=c?2:1;if(c){toast('中心 +2');sfxPerfect()}else sfxLand();
    $('score').textContent=score;
    if(score>best){best=score;$('best').textContent='最高 '+best;try{localStorage.setItem('flagjump_best',best)}catch(e){}}
    next=addBlock();st='idle';
  }else if(inside(cur,x,z)){st='idle';sfxTap()}
  else{st='fall';sfxFall();fall={vy:0,ang:0,n:null,d:jump.d.clone()}}
}

// ---------- 主循环 ----------
const PR=.65;
function pushOut(){
  const p=player.position;let hit=null;
  for(const b of blocks){
    if(b.off>.5)continue;
    const dx=p.x-b.x,dz=p.z-b.z,hs=b.s/2;let nx,nz,dist;
    if(b.round){const d=Math.hypot(dx,dz)||1e-6;nx=dx/d;nz=dz/d;dist=d-hs}
    else{
      const cx=Math.max(-hs,Math.min(hs,dx)),cz=Math.max(-hs,Math.min(hs,dz));
      const ex=dx-cx,ez=dz-cz,d=Math.hypot(ex,ez);
      if(d>1e-6){nx=ex/d;nz=ez/d;dist=d}
      else{const qx=hs-Math.abs(dx),qz=hs-Math.abs(dz);
        if(qx<qz){nx=Math.sign(dx)||1;nz=0;dist=-qx}else{nx=0;nz=Math.sign(dz)||1;dist=-qz}}
    }
    if(dist<PR){p.x+=nx*(PR-dist);p.z+=nz*(PR-dist);hit={x:nx,z:nz}}
  }
  return hit;
}
const clock=new THREE.Clock();let T=0,rafId=0,loopRunning=true;
const fallAxis=new THREE.Vector3();
function loop(){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);T+=dt;
  let amp=1;
  if(st==='charge'){
    chargeT+=dt;const r=Math.min(chargeT/1.8,1);
    body.scale.set(1+.15*r,1-.35*r,1+.15*r);
    barFill.style.width=r*100+'%';amp=1+r;
  }else if(st==='jump'){
    jump.t+=dt;const u=Math.min(jump.t/jump.dur,1),h=1.2+jump.dist*.25;
    player.position.set(jump.sx+jump.d.x*jump.dist*u,4*h*u*(1-u),jump.sz+jump.d.z*jump.dist*u);
    body.rotation.y=Math.PI/4+u*Math.PI*2;amp=2.2;
    if(u>=1)land();
  }else if(st==='fall'){
    fall.vy-=25*dt;player.position.y+=fall.vy*dt;
    player.position.x+=fall.d.x*1.5*dt;player.position.z+=fall.d.z*1.5*dt;
    if(player.position.y<.02){const h=pushOut();if(h)fall.n=h}
    fall.ang=Math.min(fall.ang+dt*3,1.6);
    const n=fall.n||fall.d;
    player.quaternion.setFromAxisAngle(fallAxis.set(n.z,0,-n.x),fall.ang);
    if(player.position.y<-7){st='over';sfxOver();$('fs').textContent=score;$('over').style.display='flex'}
  }
  blocks.forEach(b=>{if(b.off>.001){b.off+=(0-b.off)*Math.min(1,dt*7);if(b.off<.002)b.off=0;b.m.position.y=-2+b.off}});
  waveFlag(T,amp);
  const px=player.position.x,pz=player.position.z;
  const tx=st==='fall'||st==='over'?px:(px+next.x)/2,tz=st==='fall'||st==='over'?pz:(pz+next.z)/2;
  tgt.x+=(tx-tgt.x)*Math.min(1,dt*3);tgt.z+=(tz-tgt.z)*Math.min(1,dt*3);
  cam.position.copy(tgt).add(camOff);cam.lookAt(tgt);
  sun.position.set(tgt.x-5,14,tgt.z+3);sun.target.position.copy(tgt);
  renderer.render(scene,cam);
}
loop();
// 性能规范 §1/§2：不可见时停循环（恢复时丢弃跳变的时间），关闭时释放 GPU 资源
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    loopRunning=false;if(rafId)cancelAnimationFrame(rafId);
    if(st==='charge'){st='idle';body.scale.set(1,1,1);barEl.style.opacity=0;sfxChargeStop()}
  }else if(!loopRunning){loopRunning=true;clock.getDelta();loop();}
});
let disposed=false;
function disposeAll(){
  if(disposed)return;disposed=true;
  if(rafId)cancelAnimationFrame(rafId);
  sfxChargeStop();if(AC){try{AC.close()}catch(e){}AC=null}
  scene.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}
  });
  renderer.dispose();
}
addEventListener('pagehide',e=>{if(!e.persisted)disposeAll()});
addEventListener('unload',disposeAll);
</script>
</body>
